<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <h1>GAME HUB</h1>
        <p>Seus jogos em um só lugar</p>
    </header>

    <main>

        <section class="hero">
            <h2>Bem-vindo ao Game Hub!</h2>

            <p>
                Jogue gratuitamente e descubra novos desafios.
            </p>
            
        </section>

        <section class="jogos">

            <h2>Nossos jogos</h2>

            <div class="jogos-container">

                <div class="card">
                    <div class="icone">🚀</div>

                    <h3>Space Defender</h3>

                    <p>
                        Enfrente inimigos e tente alcançar a maior pontuação.
                    </p>

                    <button onclick="window.location.href='games/space-defender/index.html'">Jogar</button>
                </div>

                <div class="card">
                    <div class="icone">🎮</div>

                    <h3>Em breve</h3>

                    <p>
                        Um novo jogo está sendo desenvolvido.
                    </p>

                    <button disabled>Em breve</button>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Game Hub</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
