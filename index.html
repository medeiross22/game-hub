<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Hub</title>

    <meta
        name="description"
        content="Game Hub - Jogue gratuitamente e descubra novos desafios."
    >

    <link rel="stylesheet" href="style.css">

    <!-- Google AdSense -->
    <script
        async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7518927818203299"
        crossorigin="anonymous">
    </script>
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>GAME HUB</h1>

        <p>
            Seus jogos em um só lugar
        </p>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- APRESENTAÇÃO -->
        <section class="hero">

            <h2>
                Bem-vindo ao Game Hub!
            </h2>

            <p>
                Jogue gratuitamente e descubra novos desafios.
            </p>

        </section>


        <!-- ESPAÇO PARA ANÚNCIO -->
        <!-- O bloco de anúncio será colocado aqui posteriormente -->

        <section class="anuncio">

            <!-- Google AdSense -->

        </section>


        <!-- JOGOS -->
        <section class="jogos">

            <h2>
                Nossos jogos
            </h2>


            <div class="jogos-container">


                <!-- SPACE DEFENDER -->
                <div class="card">

                    <div class="icone">
                        🚀
                    </div>

                    <h3>
                        Space Defender
                    </h3>

                    <p>
                        Enfrente inimigos e tente alcançar
                        a maior pontuação.
                    </p>

                    <button
                        onclick="window.location.href='games/space-defender/index.html'">
                        Jogar
                    </button>

                </div>


                <!-- JOGO EM BREVE -->
                <div class="card">

                    <div class="icone">
                        🎮
                    </div>

                    <h3>
                        Em breve
                    </h3>

                    <p>
                        Um novo jogo está sendo desenvolvido.
                    </p>

                    <button disabled>
                        Em breve
                    </button>

                </div>


            </div>

        </section>


        <!-- ESPAÇO PARA OUTRO ANÚNCIO -->
        <section class="anuncio">

            <!-- Google AdSense -->

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <p>
            © 2026 Game Hub
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
